# ╔══════════════════════════════════════════════════════════════════════╗
# ║                        myzsh configuration                         ║
# ╠══════════════════════════════════════════════════════════════════════╣
# ║  Edit this file to customise your shell experience.                ║
# ║  Changes take effect on next shell session (or run: reload)        ║
# ╚══════════════════════════════════════════════════════════════════════╝

# ─── Theme ────────────────────────────────────────────────────────────
# Available themes: powerline, minimal, pure
MYZSH_THEME="powerline"

# Enable Nerd Font icons (requires a Nerd Font installed)
MYZSH_NERD_FONTS=true

# Terminal transparency (your terminal emulator must support this)
# Set to true to enable transparency-aware colour scheme
MYZSH_TRANSPARENT=true

# Colour scheme: "dark" or "light"
MYZSH_COLOR_SCHEME="dark"

# ─── Prompt Features ──────────────────────────────────────────────────
# Show git branch/status in prompt
MYZSH_SHOW_GIT=true

# Show execution time for long-running commands (threshold in seconds)
MYZSH_SHOW_EXEC_TIME=true
MYZSH_EXEC_TIME_THRESHOLD=3

# Show current Node/Python/Ruby version in prompt
MYZSH_SHOW_VERSIONS=false

# ─── Modules ──────────────────────────────────────────────────────────
# Core modules (always loaded)
# init, security, history, completion, keybindings

# Deferred modules (loaded after prompt for speed)
MYZSH_DEFERRED=(
  "plugins"
  "syntax-highlighting"
  "autosuggestions"
)

# ─── Aliases ──────────────────────────────────────────────────────────
# Enable alias groups (comment out to disable)
MYZSH_ALIASES=(
  "git"
  "docker"
  "system"
  "navigation"
  "custom"
)

# ─── Plugins ──────────────────────────────────────────────────────────
# Plugins managed as git submodules in plugins/
MYZSH_PLUGINS=(
  "zsh-autosuggestions"
  "zsh-completions"
  "zsh-syntax-highlighting"
)

# ─── History ──────────────────────────────────────────────────────────
MYZSH_HISTSIZE=50000
MYZSH_SAVEHIST=50000
MYZSH_HIST_IGNORE_DUPS=true
MYZSH_HIST_IGNORE_SPACE=true
MYZSH_HIST_SHARE=true

# ─── Completion ───────────────────────────────────────────────────────
# Enable fuzzy matching for tab completion
MYZSH_FUZZY_COMPLETION=true

# Case-insensitive completion
MYZSH_CASE_INSENSITIVE=true

# ─── Key Bindings ─────────────────────────────────────────────────────
# Style: "emacs" or "vim"
MYZSH_KEYBIND_STYLE="emacs"

# ─── Security ─────────────────────────────────────────────────────────
# Verify plugin checksums before loading
MYZSH_VERIFY_PLUGINS=true

# Restrict config directory permissions
MYZSH_STRICT_PERMISSIONS=true

# ─── Performance ──────────────────────────────────────────────────────
# Enable deferred loading (recommended)
MYZSH_DEFER=true

# Benchmark mode (set true to profile startup)
MYZSH_BENCHMARK=false
